[package]
name = "converter"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25", features = ["avif-native"] }
libheif-rs = { version = "3.0", default-features = false, features = ["v1_17"], optional = true }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tempfile = "3.17"
which = "7.0"
kamadak-exif = "0.6"

[features]
default = ["heif"]
heif = ["dep:libheif-rs"]

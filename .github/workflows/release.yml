name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: false
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libheif-dev \
            libde265-dev \
            libx265-dev \
            ghostscript \
            libdav1d-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libgl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build optimized binary
        run: cargo build --release --bin imgwheel

      - name: Package generic release archive (.tar.gz)
        run: |
          PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="imgwheel") | .version')
          RELEASE_NAME="imgwheel-v${PKG_VERSION}-x86_64-linux"
          mkdir -p "${RELEASE_NAME}/bin" "${RELEASE_NAME}/data"

          cp target/release/imgwheel "${RELEASE_NAME}/bin/"
          cp -r data/* "${RELEASE_NAME}/data/"
          cp -r packaging "${RELEASE_NAME}/"
          cp README.md LICENSE CHANGELOG.md "${RELEASE_NAME}/"

          tar -czvf "${RELEASE_NAME}.tar.gz" "${RELEASE_NAME}"
          sha256sum "${RELEASE_NAME}.tar.gz" > "${RELEASE_NAME}.tar.gz.sha256"

          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "PKG_VERSION=${PKG_VERSION}" >> $GITHUB_ENV

      - name: Package Arch Linux package (.pkg.tar.zst)
        run: |
          mkdir -p packaging/arch-bin
          cat << 'EOF' > packaging/arch-bin/PKGBUILD
          pkgname=imgwheel
          pkgver=__PKG_VER__
          pkgrel=1
          pkgdesc="A fast radial image format converter for Linux (Hyprland / Wayland / X11)"
          arch=('x86_64')
          url="https://github.com/arrifat346afs/imgwheel"
          license=('MIT')
          options=(!debug)
          depends=('gcc-libs' 'libheif' 'ghostscript' 'dav1d' 'wayland' 'libxkbcommon')
          optdepends=(
              'wl-clipboard: clipboard reading in daemon mode on Wayland'
              'xdg-desktop-portal-hyprland: global shortcuts support under Hyprland'
          )

          package() {
              install -Dm755 "${startdir}/../../target/release/imgwheel" "${pkgdir}/usr/bin/imgwheel"
              install -Dm644 "${startdir}/../../data/imgwheel.desktop" "${pkgdir}/usr/share/applications/imgwheel.desktop"
              install -Dm644 "${startdir}/../../data/imgwheel-daemon.service" "${pkgdir}/usr/lib/systemd/user/imgwheel-daemon.service"
              install -Dm644 "${startdir}/../../LICENSE" "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"
              install -Dm644 "${startdir}/../../README.md" "${pkgdir}/usr/share/doc/${pkgname}/README.md"
              install -Dm644 "${startdir}/../../CHANGELOG.md" "${pkgdir}/usr/share/doc/${pkgname}/CHANGELOG.md"

              install -Dm755 "${startdir}/../../data/file-manager/nautilus/Convert with ImgWheel" "${pkgdir}/usr/share/doc/${pkgname}/examples/nautilus/Convert with ImgWheel"
              install -Dm644 "${startdir}/../../data/file-manager/dolphin/imgwheel.desktop" "${pkgdir}/usr/share/doc/${pkgname}/examples/dolphin/imgwheel.desktop"
              install -Dm644 "${startdir}/../../data/file-manager/thunar/uca.xml" "${pkgdir}/usr/share/doc/${pkgname}/examples/thunar/uca.xml"
              install -Dm644 "${startdir}/../../data/file-manager/nemo/imgwheel.nemo_action" "${pkgdir}/usr/share/doc/${pkgname}/examples/nemo/imgwheel.nemo_action"
          }
          EOF
          sed -i "s/__PKG_VER__/${PKG_VERSION}/g" packaging/arch-bin/PKGBUILD

          docker run --rm -v "$PWD":/workspace -w /workspace archlinux:base-devel bash -c "
            useradd -m builder
            echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
            chown -R builder:builder /workspace
            su builder -c 'cd /workspace/packaging/arch-bin && makepkg -fd'
            chown -R $(id -u):$(id -g) /workspace
          "

          cd packaging/arch-bin
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          cd ../..

      - name: Determine tag name
        id: release_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v${PKG_VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ImgWheel ${{ steps.release_tag.outputs.tag }}
          files: |
            ${{ env.RELEASE_NAME }}.tar.gz
            ${{ env.RELEASE_NAME }}.tar.gz.sha256
            packaging/arch-bin/*.pkg.tar.zst
            packaging/arch-bin/*.pkg.tar.zst.sha256
          generate_release_notes: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: |
            ${{ env.RELEASE_NAME }}.tar.gz
            ${{ env.RELEASE_NAME }}.tar.gz.sha256
            packaging/arch-bin/*.pkg.tar.zst
            packaging/arch-bin/*.pkg.tar.zst.sha256
